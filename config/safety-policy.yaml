memory_pressure:
  enabled: false

workload:
  max_requests_per_second: 5
  high_volume_enabled: false

compound:
  enabled: false

application:
  max_scripted_fault_wall_s: 60
  max_line_duration_s: 3600
  max_speed: 30
  min_speed: 1
