hosts:
  - 127.0.0.1

plants:
  bottling:
    api_port: 8010
    opc_port: 4841
    components:
      api:
        command: run-api
      opc-sim:
        command: run-opc-sim
        arguments:
          - --replay
      opc-agent:
        command: run-opc-agent
      floor:
        command: run-operations
    database: sqlite
    # Components that open the plant database; the database latency hook is loaded only into these.
    database_clients:
      - api
      - opc-agent

  # The lab compose stack (CHAOSLAB_DEPLOYMENT=docker). Components are containers labelled chaoslab.target=<name>.
  bottling-docker:
    api_port: 8020
    deployment: docker
    components:
      api:
        container: api
      opc-sim:
        container: opc-sim
      opc-agent:
        container: opc-agent
      postgres:
        container: postgres
    database: postgresql

fault_targets:
  process_outage:
    - api
    - opc-sim
    - opc-agent
    - floor
  process_freeze:
    - api
    - opc-sim
    - opc-agent
    - floor
  cpu_pressure:
    - api
  resource_limit:
    - api
    - opc-sim
    - opc-agent
    - floor
  sqlite_write_lock:
    - database
  database_latency:
    - database
  container_stop:
    - api
    - opc-sim
    - opc-agent
  container_pause:
    - api
    - opc-sim
    - opc-agent
    - postgres
  container_resource_limit:
    - api
    - opc-sim
    - opc-agent
    - postgres
  container_network_disconnect:
    - api
    - opc-sim
    - opc-agent
  database_outage:
    - postgres
