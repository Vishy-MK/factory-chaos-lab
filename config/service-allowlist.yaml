hosts:
  - 127.0.0.1

plants:
  bottling:
    api_port: 8010
    opc_port: 4841
    components:
      api:
        command: run-api
      opc-sim:
        command: run-opc-sim
        arguments:
          - --replay
      opc-agent:
        command: run-opc-agent
      floor:
        command: run-operations
    database: sqlite
    # Components that open the plant database; the database latency hook is loaded only into these.
    database_clients:
      - api
      - opc-agent

fault_targets:
  process_outage:
    - api
    - opc-sim
    - opc-agent
    - floor
  process_freeze:
    - api
    - opc-sim
    - opc-agent
    - floor
  cpu_pressure:
    - api
  resource_limit:
    - api
    - opc-sim
    - opc-agent
    - floor
  sqlite_write_lock:
    - database
  database_latency:
    - database
