name: baseline-observe
description: Observe the healthy lab plant for 20 seconds with no fault. Establishes API, ingestion and component baselines.
category: infrastructure
target:
  plant: bottling
fault:
  type: none
  parameters:
    duration_s: 20
baseline_s: 20
workload: baseline
expected_measurements:
  - api_success_ratio
  - tag_ingest_per_second
  - machines_connected
recovery:
  timeout_s: 30
scoring: none
